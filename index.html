<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ML Efficient</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #050b18; }
      body { overflow-x: hidden; }
      .app-loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden; background: #02040a; }
      .loader-logo-wrap { position: relative; width: 164px; height: 164px; display: grid; place-items: center; }
      .loader-logo-wrap img { width: 116px; height: 116px; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="app-loader" class="app-loader" role="status" aria-label="Loading ML Efficient">
      <div class="loader-logo-wrap">
        <span class="loader-ring" aria-hidden="true"></span>
        <img src="/assets/rnd-cell-loader.png" alt="R&D Cell" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
